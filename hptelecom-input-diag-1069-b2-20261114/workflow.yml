name: Isolated hptelecom simulator input diagnostic
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hptelecom-input-diag-1069-b2-20261114
  cancel-in-progress: false

jobs:
  simulator-input:
    if: github.repository == 'trieutiendl/hptelecom' && github.event.repository.private == false && github.actor == 'trieutiendl' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: hptelecom-input-diag-1069-b2-20261114
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
      - name: Verify the isolated diagnostic source
        env:
          HP_IOS_BUILD_KEY: ${{ secrets.HPTELECOM_INPUT_DIAG_20261114_SOURCE }}
        run: |
          set -euo pipefail
          umask 077
          export BUILD_HELPERS="$GITHUB_WORKSPACE/hptelecom-input-diag-1069-b2-20261114"
          export BUILD_WORK="$RUNNER_TEMP/hptelecom-input-diagnostic-source"
          test ! -e "$BUILD_WORK"
          mkdir -p "$BUILD_WORK"
          node "$BUILD_HELPERS/crypt.cjs" decrypt "$BUILD_HELPERS/source.enc" "$BUILD_WORK/source.zip"
          unset HP_IOS_BUILD_KEY
          python3 "$BUILD_HELPERS/verify-provenance.py"
      - name: Observe one synthetic registration in an isolated simulator
        env:
          DIAGNOSTIC_APP_SOURCE: ${{ runner.temp }}/hptelecom-input-diagnostic-source/app
          DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/hptelecom-input-diagnostic-output
        run: |
          set -euo pipefail
          umask 077
          # All build and XCTest output stays ephemeral. Do not echo it on failure.
          if ! bash "$GITHUB_WORKSPACE/hptelecom-input-diag-1069-b2-20261114/run-diagnostic.sh" > "$RUNNER_TEMP/hptelecom-input-diagnostic-private.log" 2>&1; then
            echo 'Diagnostic did not complete; only schema-validated output may be retained.'
            exit 1
          fi
      - name: Encrypt only validated numeric JSON and provenance
        if: always()
        env:
          HP_IOS_BUILD_KEY: ${{ secrets.HPTELECOM_INPUT_DIAG_20261114_SOURCE }}
        run: |
          set -euo pipefail
          umask 077
          source="$RUNNER_TEMP/hptelecom-input-diagnostic-output/validated"
          destination="$RUNNER_TEMP/hptelecom-input-diagnostic-encrypted"
          if [[ -f "$source/diagnostic.json" && -f "$source/provenance.json" ]]; then
            mkdir -p "$destination"
            for name in diagnostic.json provenance.json; do
              node "$GITHUB_WORKSPACE/hptelecom-input-diag-1069-b2-20261114/crypt.cjs" encrypt "$source/$name" "$destination/$name.enc"
            done
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hptelecom-input-diag-1069-b2-20261114-encrypted
          path: ${{ runner.temp }}/hptelecom-input-diagnostic-encrypted/*.enc
          retention-days: 1
          if-no-files-found: warn
      - name: Remove ephemeral diagnostic inputs and logs
        if: always()
        run: |
          set -euo pipefail
          case "$RUNNER_TEMP" in /*) ;; *) exit 1;; esac
          rm -rf -- "$RUNNER_TEMP/hptelecom-input-diagnostic-source" "$RUNNER_TEMP/hptelecom-input-diagnostic-output" "$RUNNER_TEMP/hptelecom-input-diagnostic-encrypted"
          rm -f -- "$RUNNER_TEMP/hptelecom-input-diagnostic-private.log"
