# Expire the former API-only staging cookie when login/logout sets a new cookie.
map $upstream_http_set_cookie $staging_legacy_cookie {
    "" "";
    default "hp_session=; Max-Age=0; Path=/staging/api; Secure; HttpOnly; SameSite=Lax";
}

server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    location = /staging { return 308 /staging/; }

    location ^~ /staging/api/ {
        rewrite ^/staging/api/(.*)$ /api/$1 break;
        proxy_pass http://hptelecom-staging-independent-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cookie_path /api /staging;
        add_header Set-Cookie $staging_legacy_cookie always;
        add_header Cache-Control "no-store" always;
    }

    # The existing endpoint checks both an active session and the admin role.
    location = /staging-admin-check {
        internal;
        proxy_pass http://hptelecom-staging-independent-api:8080/api/users;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /staging/nguoidung { return 308 /staging/nguoidung/; }
    location ^~ /staging/nguoidung/ {
        auth_request /staging-admin-check;
        error_page 401 = @staging_login;
        error_page 403 = @staging_overview;
        rewrite ^/staging/(.*)$ /$1 break;
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-store" always;
    }

    location @staging_login { return 302 /staging/dangnhap/; }
    location @staging_overview { return 302 /staging/tonghop/tongquan/; }

    location ~ ^/staging/nhom/[a-z0-9-]+/?$ {
        rewrite ^/staging/nhom/[a-z0-9-]+/?$ /nhom/index.html break;
        try_files /nhom/index.html =404;
    }

    location /staging/ {
        rewrite ^/staging/(.*)$ /$1 break;
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    location / { return 404; }
}
