(()=>{const $=id=>document.getElementById(id);let m=0;const N=["Tắt","Nháy khi chụp","Bật đèn liên tục"],I=["⚡","⚡A","🔦"];

(()=>{const $=id=>document.getElementById(id);const F=[["Giờ, phút, giây + ngày/tháng/năm","07:39:12  |  12/10/2026"],["Giờ, phút + ngày/tháng/năm","07:39  |  12/10/2026"],["Chỉ ngày/tháng/năm","12/10/2026"],["Chỉ giờ, phút, giây","07:39:12"],["Chỉ giờ, phút","07:39"]];
let S={logo:true,date:true,fmt:0,addr:true,gps:true,alt:false,auth:true,note:""};

e.innerHTML=(S.logo?'<img src="logo.svg" alt="HP telecom" style="width:20%;max-width:64px;min-width:44px;height:auto;display:block;margin-bottom:3px">':"")+L.join("<br>")};
const ck=(id,l,v)=>`<label style="display:flex;gap:10px;align-items:center;min-height:44px;margin:0"><input type="checkbox" id="${id}" ${v?"checked":""} style="width:20px;height:20px"> ${l}</label>`;
const open=()=>{let d=$("cmau");if(d)d.remove();d=document.createElement("div");d.id="cmau";d.className="card";d.setAttribute("role","dialog");d.setAttribute("aria-label","Mẫu dấu trên ảnh");d.style.cssText="margin-top:10px;border-color:var(--acc)";
d.innerHTML=`<b style="font-size:17px">Mẫu dấu trên ảnh</b><div style="display:flex;align-items:center;justify-content:space-between">${ck("mlg","Logo",S.logo)}<button class="btn s" id="mlc" style="width:auto;padding:0 14px">Đổi logo</button></div><p class="mute" style="margin:0 0 6px">Logo giữ đúng tỷ lệ, rộng tối đa 20% khung ảnh.</p>${ck("mdt","Hiện ngày / giờ chụp",S.date)}<label for="mfm" style="margin-top:4px">Kiểu ngày / giờ</label><select id="mfm">${F.map((f,i)=>`<option value="${i}" ${i==S.fmt?"selected":""}>${f[0]}</option>`).join("")}</select><div class="mute" id="mpv" style="padding:4px 0 8px"></div>${ck("mad","Địa chỉ từ GPS",S.addr)}${ck("mgp","Tọa độ GPS",S.gps)}${ck("mal","Độ cao khi GPS có dữ liệu",S.alt)}${ck("mau","Người chụp",S.auth)}<input id="mnt" maxlength="180" placeholder="Ghi chú trên ảnh" aria-label="Ghi chú trên ảnh" value="${esc(S.note).replace(/"/g,"&quot;")}" style="margin-top:6px"><div class="row" style="margin-top:10px"><button class="btn s" id="mhu">Hủy</button><button class="btn p s" id="mlu">Lưu</button></div>`;
$("ctp").closest(".row").after(d);pv();d.scrollIntoView({block:"nearest"})};
const pv=()=>{const a=$("mdt"),f=$("mfm");if(!a)return;f.disabled=!a.checked;f.style.opacity=a.checked?1:.45;$("mpv").textContent=a.checked?"Xem trước: "+F[f.value][1]:"Không hiện ngày / giờ trên ảnh"};
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||!$("cv"))return;
if(b.id==="ctp")open();
if(b.id==="mhu")$("cmau").remove();

if(b.id==="cdate"){S.date=!S.date}
if(["cdate","ccol","cfs","mlu"].includes(b.id))setTimeout(render,0)});
document.addEventListener("change",e=>{if(e.target.id==="mdt"||e.target.id==="mfm")pv()});
new MutationObserver(()=>{if($("cv")&&!$("cv").dataset.minit){$("cv").dataset.minit=1;setTimeout(render,0)}}).observe(document.body,{childList:true,subtree:true});})();(()=>{const R=["Chủ nhóm","Điều phối viên","Kỹ thuật viên"],RT=["Tuyến QL14 Km40–45","Tuyến Buôn Ma Thuột 02","Tuyến Krông Pắk 05"];
let M=[{n:"Minh",r:0,t:[]},{n:"Trần B",r:1,t:["Tuyến QL14 Km40–45"]},{n:"Lê C",r:2,t:[]}],sel=-1;
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const msg=x=>{const m=$("tmsg");if(m)m.textContent=x};
const cnt=()=>{const c=document.querySelector("#body details.grp .chip.info");if(c)c.textContent=M.length;const h=document.querySelector("#body .card .mute");if(h)h.textContent="Tổ chức · mã nhóm daklak · "+M.length+" thành viên"};
const list=()=>{const l=$("tmem");if(!l)return;const q=(($("tq")||{}).value||"").toLowerCase();
l.innerHTML=M.map((m,i)=>({m,i})).filter(o=>o.m.n.toLowerCase().includes(q)).map(({m,i})=>`<div class="row" style="align-items:center;border-bottom:1px solid var(--line);margin:0;padding:4px 0;gap:6px"><div style="flex:1;min-width:0;line-height:1.25"><b>${esc(m.n)}</b> <span class="mute" style="font-size:12px">· ${R[m.r]}${m.t.length?" · "+m.t.length+" tuyến":""}</span></div>${m.r?`<button class="btn s" style="flex:none;width:40px;min-height:0;padding:2px 0" data-tm="${i}" aria-label="Quản lý ${esc(m.n)}">⋯</button>`:""}</div>`).join("")||'<div class="mute" style="padding:8px 0">Không có thành viên phù hợp</div>';cnt()};
const panel=()=>{const a=$("tact");if(!a)return;if(sel<0){a.innerHTML="";return}const m=M[sel];
a.innerHTML=`<div class="card" style="padding:10px"><b>${esc(m.n)}</b><div class="row" style="margin-top:6px;gap:6px;flex-wrap:nowrap"><button class="btn s" style="padding:6px 2px;font-size:12.5px;min-height:0" data-ta="role">Đổi vai trò</button><button class="btn s" style="padding:6px 2px;font-size:12.5px;min-height:0" data-ta="route">Giao tuyến</button><button class="btn s" style="padding:6px 2px;font-size:12.5px;min-height:0;color:#d9534f" data-ta="del">Xóa</button><button class="btn s" style="padding:6px 2px;font-size:12.5px;min-height:0" data-ta="close" aria-label="Đóng">✕</button></div><div id="trs"></div></div>`};
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||!$("tmem")&&!b.dataset.ta)return;
if(b.dataset.tm!==undefined){sel=+b.dataset.tm;panel();$("tact").scrollIntoView({block:"nearest"});return}
if(b.id=="tadd"){sel=-1;$("tact").innerHTML=`<div class="card"><label for="tnm">Tên đăng nhập</label><input id="tnm" placeholder="Ví dụ: nguyenvand"><label for="tnr">Vai trò</label><select id="tnr"><option value="2">Kỹ thuật viên</option><option value="1">Điều phối viên</option></select><div class="row" style="margin-top:8px"><button class="btn s" data-ta="cancel">Hủy</button><button class="btn p" data-ta="ok">Thêm</button></div></div>`;return}
if(b.id=="tleave"){$("tact").innerHTML=`<div class="card">Rời nhóm Đắk Lắk? Bạn là Chủ nhóm nên cần chuyển quyền trước.<div class="row" style="margin-top:8px"><button class="btn s" data-ta="close">Đóng</button></div></div>`;return}
const k=b.dataset.ta;if(!k)return;const m=M[sel];
if(k=="close"||k=="cancel"){sel=-1;panel();$("tact").innerHTML="";return}
if(k=="ok"){const n=($("tnm").value||"").trim();if(!n){msg("Nhập tên đăng nhập");return}if(M.some(x=>x.n.toLowerCase()==n.toLowerCase())){msg("Người này đã trong nhóm");return}M.push({n,r:+$("tnr").value,t:[]});$("tact").innerHTML="";list();msg("Đã thêm "+n+" (Minh họa)");return}
if(k=="role"){m.r=m.r==1?2:1;list();panel();msg("Đã đổi vai trò "+m.n+" → "+R[m.r]);return}
if(k=="route"){$("trs").innerHTML=RT.map((r,i)=>`<label style="display:flex;gap:8px;align-items:center;margin:2px 0;font-size:13px"><input type="checkbox" data-tr="${i}" style="width:20px;height:20px;flex:none;margin:0" ${m.t.includes(r)?"checked":""}><span style="flex:1;text-align:left">${r}</span></label>`).join("");return}
if(k=="del"){M.splice(sel,1);sel=-1;$("tact").innerHTML="";list();msg("Đã xóa khỏi nhóm (Minh họa)");return}});
document.addEventListener("change",e=>{const c=e.target;if(c.dataset&&c.dataset.tr!==undefined&&sel>=0){const r=RT[+c.dataset.tr],m=M[sel];m.t=c.checked?[...new Set([...m.t,r])]:m.t.filter(x=>x!=r);list();msg((c.checked?"Đã giao ":"Đã bỏ giao ")+r+" cho "+m.n)}});
document.addEventListener("input",e=>{if(e.target.id=="tq")list()});
new MutationObserver(()=>{const l=$("tmem");if(l&&!l.dataset.i){l.dataset.i=1;sel=-1;list()}}).observe(document.body,{childList:true,subtree:true});})();(()=>{const tab=k=>{const b=document.querySelector('[data-lt="'+k+'"]');b&&b.click()};
document.addEventListener("click",e=>{const d=e.target.closest("[data-pd]");
if(d){const [n,k]=d.dataset.pd.split("|");(window.LD[n]=window.LD[n]||[]).push(+k);(window.TR=window.TR||[]).push(["Ảnh "+k+" ("+n.replace(/^\S+\s/,"")+")","xóa 12/10",n,+k]);const tile=d.parentElement,det=tile.closest("details"),c=det.querySelector(".chip");c.textContent=Math.max(0,(+c.textContent)-1);tile.remove();const ph=det.querySelector(".ph");if(!ph.children.length)ph.innerHTML='<span class="mute">Không còn ảnh</span>';return}
const r=e.target.closest("[data-trr]"),x=e.target.closest("[data-trx]");
if(r){const it=window.TR.splice(+r.dataset.trr,1)[0];if(it[2]&&window.LD[it[2]])window.LD[it[2]]=window.LD[it[2]].filter(v=>v!==it[3]);tab("t")}
if(x){window.TR.splice(+x.dataset.trx,1);tab("t")}});})();</script>
