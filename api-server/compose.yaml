services:
  hptelecom-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hptelecom-api
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      PORT: "8080"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://hptelecom.id.vn}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - hptelecom-api-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  hptelecom-api-data:
