name: Build HP Telecom Map APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-map/**'
      - '.github/workflows/build-android-map.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        working-directory: android-map
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Save APK as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: HP-Telecom-Map-Android
          path: android-map/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
