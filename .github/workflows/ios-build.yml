name: HP Telecom iOS 4.1.16

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hp-telecom-ios-release
  cancel-in-progress: false

jobs:
  build:
    # Standard macOS runners in this public repository are free. Never silently
    # change to a private repository or a larger (paid) runner.
    if: github.repository == 'trieutiendl/hptelecom' && github.event.repository.private == false && github.actor == 'trieutiendl' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Read build configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: ios-build
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
      - name: Build and sign iOS
        env:
          HP_IOS_BUILD_KEY: ${{ secrets.HP_IOS_SOURCE_KEY_416_45 }}
          HP_IOS_SIGNING_JSON: ${{ secrets.HP_IOS_SIGNING_416_45 }}
        run: bash ios-build/build.sh
      - name: Preserve encrypted result and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hp-telecom-ios-${{ github.run_id }}
          path: ${{ runner.temp }}/hp-ios-artifacts/*.enc
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
      - name: Remove temporary signing material
        if: always()
        run: bash ios-build/cleanup.sh
