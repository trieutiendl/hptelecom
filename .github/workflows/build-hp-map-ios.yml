name: HP Map iOS 1.0.0 (3)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hp-map-ios-release
  cancel-in-progress: false

jobs:
  build:
    # Standard public macOS runner only. No paid/private runner fallback.
    if: github.repository == 'trieutiendl/hptelecom' && github.event.repository.private == false && github.actor == 'trieutiendl' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CI: '1'
    steps:
      - name: Read HP Map build configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: map-ios-build
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
      - name: Test, build and sign separate HP Map app
        env:
          HP_MAP_IOS_SOURCE_100_3: ${{ secrets.HP_MAP_IOS_SOURCE_100_3 }}
          HP_MAP_IOS_SIGNING_100_3: ${{ secrets.HP_MAP_IOS_SIGNING_100_3 }}
        run: bash map-ios-build/build.sh
      - name: Preserve encrypted result and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hp-map-ios-${{ github.run_id }}
          path: ${{ runner.temp }}/hp-map-ios-artifacts/*.enc
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
      - name: Remove temporary signing material
        if: always()
        run: bash map-ios-build/cleanup.sh
