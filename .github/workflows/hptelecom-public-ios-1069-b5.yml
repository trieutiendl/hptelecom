name: Build public hptelecom for iPhone
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hptelecom-public-ios-1069-b5
  cancel-in-progress: false

jobs:
  archive:
    needs: login
    if: github.repository == 'trieutiendl/hptelecom' && github.event.repository.private == false && github.actor == 'trieutiendl' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - &checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: hptelecom-public-ios-1069-b5
      - &node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
      - &source
        name: Verify the frozen public app source
        env:
          HP_IOS_BUILD_KEY: ${{ secrets.HPTELECOM_PUBLIC_IOS_1069_B5_SOURCE }}
        run: |
          set -euo pipefail
          umask 077
          export BUILD_HELPERS="$GITHUB_WORKSPACE/hptelecom-public-ios-1069-b5"
          export BUILD_WORK="$RUNNER_TEMP/hptelecom-public-input"
          mkdir -p "$BUILD_WORK/app"
          cd "$BUILD_HELPERS"
          node crypt.cjs decrypt source.enc "$BUILD_WORK/source.zip"
          unset HP_IOS_BUILD_KEY
          test "$(shasum -a 256 "$BUILD_WORK/source.zip" | cut -d' ' -f1)" = "$(node -p "require('./release.json').sourceSha256")"
          python3 verify-source.py
      - name: Build and validate the signed iPhone app
        env:
          HP_IOS_SIGNING_JSON: ${{ secrets.HPTELECOM_PUBLIC_IOS_1069_B5_SIGNING }}
        run: |
          set -euo pipefail
          umask 077
          cd hptelecom-public-ios-1069-b5
          export PUBLIC_APP_SOURCE="$RUNNER_TEMP/hptelecom-public-input/app"
          export PUBLIC_APP_ARTIFACTS="$RUNNER_TEMP/hptelecom-public-output"
          export HP_PUBLIC_BUNDLE_ID="$(node -p "require('./release.json').bundleIdentifier")"
          export HP_PUBLIC_VERSION="$(node -p "require('./release.json').version")"
          export HP_PUBLIC_BUILD="$(node -p "require('./release.json').build")"
          bash build-macos.sh > "$RUNNER_TEMP/hptelecom-public-build.log" 2>&1
      - name: Package encrypted output
        if: always()
        env:
          HP_IOS_BUILD_KEY: ${{ secrets.HPTELECOM_PUBLIC_IOS_1069_B5_SOURCE }}
        run: |
          set -euo pipefail
          umask 077
          cd hptelecom-public-ios-1069-b5
          destination="$RUNNER_TEMP/hptelecom-public-encrypted"
          mkdir -p "$destination"
          for file in "$RUNNER_TEMP/hptelecom-public-output/"*.ipa "$RUNNER_TEMP/hptelecom-public-output/verification.json"; do
            if [[ -f "$file" ]]; then
              node crypt.cjs encrypt "$file" "$destination/$(basename "$file").enc"
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hptelecom-public-ios-1069-b5-encrypted
          path: ${{ runner.temp }}/hptelecom-public-encrypted/*.enc
          retention-days: 1
          if-no-files-found: warn

  login:
    if: github.repository == 'trieutiendl/hptelecom' && github.event.repository.private == false && github.actor == 'trieutiendl' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - *checkout
      - *node
      - *source
      - name: Test fresh registration, sign-in and saved reports on iPhone
        id: login
        env:
          PUBLIC_APP_SOURCE: ${{ runner.temp }}/hptelecom-public-input/app
          PUBLIC_LOGIN_RESULT: ${{ runner.temp }}/login-result.json
          PUBLIC_LOGIN_MANIFEST: ${{ github.workspace }}/hptelecom-public-ios-1069-b5/release.json
          PUBLIC_TEST_MODE: login
        run: |
          set -euo pipefail
          bash hptelecom-public-ios-1069-b5/screenshots/capture-macos.sh >"$RUNNER_TEMP/native-qa.log" 2>&1
      - name: Protect the credential-free QA receipt
        if: always()
        env:
          HP_IOS_BUILD_KEY: ${{ secrets.HPTELECOM_PUBLIC_IOS_1069_B5_SOURCE }}
          NATIVE_OUTCOME: ${{ steps.login.outcome }}
        run: |
          set -euo pipefail
          umask 077
          cd hptelecom-public-ios-1069-b5
          destination="$RUNNER_TEMP/hptelecom-public-qa-encrypted"
          mkdir -p "$destination"
          python3 - <<'PYQA'
          import json, os
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          log = temp / 'native-qa.log'
          lines = log.read_text(errors='replace') if log.exists() else ''
          checks = ['Global and per-device software keyboard verified', 'Verified simulator app identity',
                    'Pre-test device is available and booted', 'error: unable to find', 'Timed out',
                    'npm error', 'Unable to find a destination', 'BUILD FAILED', 'TEST BUILD FAILED']
          (temp / 'runner-status.json').write_text(json.dumps({
            'stepOutcome': os.environ['NATIVE_OUTCOME'], 'observed': [s for s in checks if s in lines]
          }))
          PYQA
          for file in "$RUNNER_TEMP/runner-status.json" "$RUNNER_TEMP/login-result.json"; do
            if [[ -f "$file" ]]; then
              node crypt.cjs encrypt "$file" "$destination/$(basename "$file").enc"
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hptelecom-public-ios-1069-b5-qa-encrypted
          path: ${{ runner.temp }}/hptelecom-public-qa-encrypted/*.enc
          retention-days: 1
          if-no-files-found: error
