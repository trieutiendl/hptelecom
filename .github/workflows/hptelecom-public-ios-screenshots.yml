name: Capture public hptelecom iPhone screenshots
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hptelecom-public-ios-screenshots
  cancel-in-progress: false
jobs:
  screenshots:
    if: github.repository == 'trieutiendl/hptelecom' && github.event.repository.private == false && github.actor == 'trieutiendl' && startsWith(github.ref, 'refs/tags/hptelecom-public-ios-shots-')
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            hptelecom-public-ios
            hptelecom-public-ios-screenshots
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
      - name: Verify the frozen public app source
        env:
          HP_IOS_BUILD_KEY: ${{ secrets.HPTELECOM_PUBLIC_IOS_SCREENSHOT_SOURCE }}
        run: |
          set -euo pipefail
          umask 077
          export BUILD_HELPERS="$GITHUB_WORKSPACE/hptelecom-public-ios"
          export BUILD_WORK="$RUNNER_TEMP/hptelecom-public-input"
          mkdir -p "$BUILD_WORK/app"
          cd "$BUILD_HELPERS"
          node crypt.cjs decrypt source.enc "$BUILD_WORK/source.zip"
          unset HP_IOS_BUILD_KEY
          test "$(shasum -a 256 "$BUILD_WORK/source.zip" | cut -d' ' -f1)" = "$(node -p "require('./release.json').sourceSha256")"
          python3 verify-source.py
      - name: Capture the running public iPhone app
        env:
          PUBLIC_SIMULATOR_CACHE: ${{ runner.temp }}/hptelecom-simulator-cache
          PUBLIC_APP_SOURCE: ${{ runner.temp }}/hptelecom-public-input/app
          PUBLIC_SCREENSHOT_OUTPUT: ${{ runner.temp }}/hptelecom-public-screenshots
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PUBLIC_SCREENSHOT_OUTPUT"
          bash "$GITHUB_WORKSPACE/hptelecom-public-ios-screenshots/capture-macos.sh" >"$RUNNER_TEMP/hptelecom-public-screenshots.log" 2>&1
      - name: Preserve the compiled simulator app for another capture
        if: always()
        env:
          HP_IOS_BUILD_KEY: ${{ secrets.HPTELECOM_PUBLIC_IOS_SCREENSHOT_SOURCE }}
        run: |
          set -euo pipefail
          umask 077
          cd hptelecom-public-ios
          file="$RUNNER_TEMP/hptelecom-simulator-cache/simulator-app.zip"
          if [[ -s "$file" ]]; then
            node crypt.cjs encrypt "$file" "$file.enc"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hptelecom-public-ios-simulator-encrypted
          path: ${{ runner.temp }}/hptelecom-simulator-cache/simulator-app.zip.enc
          retention-days: 1
          if-no-files-found: ignore
      - name: Keep screenshots already captured if a later step failed
        if: failure()
        env:
          HP_IOS_BUILD_KEY: ${{ secrets.HPTELECOM_PUBLIC_IOS_SCREENSHOT_SOURCE }}
        run: |
          set -euo pipefail
          umask 077
          cd hptelecom-public-ios
          mkdir -p "$RUNNER_TEMP/hptelecom-public-screenshots-encrypted"
          if find "$RUNNER_TEMP/hptelecom-public-screenshots" -maxdepth 1 -name "*.png" -print -quit | grep -q .; then
            python3 "$GITHUB_WORKSPACE/hptelecom-public-ios-screenshots/verify-screenshots.py" "$RUNNER_TEMP/hptelecom-public-screenshots" release.json --partial >"$RUNNER_TEMP/screenshot-receipt.json"
            node crypt.cjs encrypt "$RUNNER_TEMP/screenshot-receipt.json" "$RUNNER_TEMP/hptelecom-public-screenshots-encrypted/screenshot-receipt.json.enc"
          fi
          for name in 01-home 02-incident 03-cable-materials 04-route-list 05-account-access; do
            file="$RUNNER_TEMP/hptelecom-public-screenshots/$name.png"
            if [[ -f "$file" ]]; then
              node crypt.cjs encrypt "$file" "$RUNNER_TEMP/hptelecom-public-screenshots-encrypted/$name.png.enc"
            fi
          done
      - name: Verify and encrypt App Store screenshots
        env:
          PUBLIC_SCREENSHOT_OUTPUT: ${{ runner.temp }}/hptelecom-public-screenshots
          HP_IOS_BUILD_KEY: ${{ secrets.HPTELECOM_PUBLIC_IOS_SCREENSHOT_SOURCE }}
        run: |
          set -euo pipefail
          umask 077
          cd hptelecom-public-ios
          python3 "$GITHUB_WORKSPACE/hptelecom-public-ios-screenshots/verify-screenshots.py" "$PUBLIC_SCREENSHOT_OUTPUT" release.json >"$RUNNER_TEMP/screenshot-receipt.json"
          destination="$RUNNER_TEMP/hptelecom-public-screenshots-encrypted"
          mkdir -p "$destination"
          for file in "$PUBLIC_SCREENSHOT_OUTPUT"/*.png; do
            node crypt.cjs encrypt "$file" "$destination/$(basename "$file").enc"
          done
          node crypt.cjs encrypt "$RUNNER_TEMP/screenshot-receipt.json" "$destination/screenshot-receipt.json.enc"
      - name: Encrypt capture diagnostics
        if: always()
        env:
          HP_IOS_BUILD_KEY: ${{ secrets.HPTELECOM_PUBLIC_IOS_SCREENSHOT_SOURCE }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -f "$RUNNER_TEMP/hptelecom-public-screenshots.log" ]]; then
            destination="$RUNNER_TEMP/hptelecom-public-screenshots-encrypted"
            mkdir -p "$destination"
            node hptelecom-public-ios/crypt.cjs encrypt "$RUNNER_TEMP/hptelecom-public-screenshots.log" "$destination/hptelecom-public-screenshots.log.enc"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hptelecom-public-ios-screenshots-encrypted
          path: ${{ runner.temp }}/hptelecom-public-screenshots-encrypted/*.enc
          retention-days: 1
          if-no-files-found: warn
